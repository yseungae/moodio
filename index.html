<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#242321" />
    <meta name="description" content="하루 한 곡과 마음을 기록하는 조용한 음악 일기" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Moodio" />
    <title>Moodio</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button id="menuButton" class="icon-button menu-button" type="button" aria-expanded="false" aria-controls="sideDrawer">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          <span class="sr-only" data-i18n="openMenu">메뉴 열기</span>
        </button>
        <button class="wordmark" type="button" data-route="home" aria-label="Moodio home">
          <span>Moodio</span>
        </button>
        <div class="topbar-actions">
          <button id="updateButton" class="icon-button" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 8.2A7 7 0 0 1 18.8 7M17.9 15.8A7 7 0 0 1 5.2 17"/></svg>
            <span class="sr-only" data-i18n="update">업데이트</span>
          </button>
          <div class="language-wrap">
            <button id="languageButton" class="icon-button" type="button" aria-haspopup="menu" aria-expanded="false">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.8 9h16.4M3.8 15h16.4M12 3.5c2.2 2.3 3.3 5.1 3.3 8.5S14.2 18.2 12 20.5C9.8 18.2 8.7 15.4 8.7 12S9.8 5.8 12 3.5Z"/></svg>
              <span class="sr-only" data-i18n="language">언어</span>
            </button>
            <div id="languageMenu" class="language-menu" role="menu" hidden>
              <button type="button" role="menuitem" data-language="ko">한국어</button>
              <button type="button" role="menuitem" data-language="en">English</button>
            </div>
          </div>
        </div>
      </header>

      <main id="app" tabindex="-1"></main>
    </div>

    <div id="drawerScrim" class="drawer-scrim"></div>
    <aside id="sideDrawer" class="side-drawer" aria-hidden="true" inert>
      <div class="drawer-head">
        <div><strong>Moodio</strong><span data-i18n="appTagline">하루 한 곡, 마음 한 조각</span></div>
        <button id="closeMenu" class="icon-button" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
          <span class="sr-only" data-i18n="closeMenu">메뉴 닫기</span>
        </button>
      </div>
      <nav id="drawerNav" class="drawer-nav" aria-label="Primary">
        <button type="button" data-route="home">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z"/></svg>
          <span data-i18n="home">홈</span>
        </button>
        <button type="button" data-route="archive">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M8 3v5M16 3v5M4 10h16"/></svg>
          <span data-i18n="archive">지난 기록</span>
        </button>
        <button type="button" data-route="settings">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
          <span data-i18n="settings">설정</span>
        </button>
      </nav>
      <p class="drawer-version">Moodio v0.1</p>
    </aside>

    <div id="artworkModal" class="artwork-modal" role="dialog" aria-modal="true" aria-label="Album artwork" hidden>
      <button id="closeArtwork" class="modal-close" type="button" aria-label="Close">×</button>
      <img id="modalArtwork" alt="" />
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <audio id="previewAudio" preload="none"></audio>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
